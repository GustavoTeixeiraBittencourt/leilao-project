packages:
  - "apps/*"

# Scripts de build permitidos. Desde o pnpm 10 eles são bloqueados por padrao e,
# a partir do 11, esta lista vive aqui e nao mais em package.json (o pnpm.
# onlyBuiltDependencies antigo e ignorado). Sem isso o install falha com
# ERR_PNPM_IGNORED_BUILDS, como aconteceu no Render.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
