server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Arquivos com hash no nome (gerados pelo Vite) podem ficar em cache para sempre.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA: qualquer rota do React Router (/lots/:id, /audit/:id, /r/:token...) devolve o
  # index.html, para o link compartilhável funcionar ao abrir direto ou recarregar.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
