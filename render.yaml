services:
  - type: web
    name: leilao-api
    runtime: node
    plan: free
    region: oregon
    # NODE_ENV=production vale também no build do Render, e nesse modo o pnpm
    # PULA as devDependencies. `tsc` (build) e `prisma` (migrate deploy no start)
    # são devDependencies, então o install precisa de --prod=false.
    buildCommand: "npm install -g pnpm@12 && pnpm install --frozen-lockfile --prod=false && pnpm --filter @leilao/api build"
    # Roda `prisma migrate deploy` (nunca `migrate dev`) e sobe o servidor, que
    # também inicia o worker de encerramento (fecha lotes vencidos ao acordar).
    startCommand: "pnpm --filter @leilao/api start"
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: leilao-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false # preencher com a URL do deploy no Vercel (uma única origem)
      - key: JWT_SECRET
        generateValue: true
      - key: AUDIT_SECRET
        generateValue: true # NUNCA trocar depois do seed: invalida a cadeia de hash
      - key: WORKER_INTERVAL_MS
        value: 1500

databases:
  - name: leilao-db
    plan: free
    region: oregon
