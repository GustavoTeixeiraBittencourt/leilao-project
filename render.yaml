services:
  - type: web
    name: leilao-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: "npm install -g pnpm && pnpm install --frozen-lockfile && pnpm --filter @leilao/api build"
    startCommand: "pnpm --filter @leilao/api start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: leilao-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false # preencher com a URL do deploy no Vercel
      - key: JWT_SECRET
        generateValue: true
      - key: AUDIT_SECRET
        generateValue: true

databases:
  - name: leilao-db
    plan: free
    region: oregon
